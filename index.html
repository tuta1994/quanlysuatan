<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Suất Ăn Nhà Máy - Sinaran VN</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .header-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .avatar-icon {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(52, 152, 219, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(52, 152, 219, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(52, 152, 219, 0); }
        }
        .brand-name {
            font-family: serif;
            font-size: 32px;
            font-style: italic;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }
        h2 {
            color: #34495e;
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: 600;
        }
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 18px;
            font-size: 22px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            background-color: #fafbfc;
            letter-spacing: 1px;
        }
        input[type="text"]:focus {
            border-color: #27ae60;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(39, 174, 96, 0.25);
        }
        .instruction {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        #result {
            margin-top: 20px;
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }
        .time-text {
            font-size: 14px;
            color: #555;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header-section">
        <div class="avatar-icon" title="Nhân viên quét mã">👨‍💼</div>
        <div class="brand-name">Sinaran VN</div>
    </div>

    <h2>🍽️ Xác Nhận Suất Ăn Nhà Máy</h2>
    
    <div class="instruction">Vui lòng quét mã QR nhân viên vào ô bên dưới</div>

    <div class="input-group">
        <input type="text" id="MaNhanVien" placeholder="Đang chờ quét mã..." autocomplete="off" autofocus>
    </div>
    
    <div id="result" style="background-color: #f1f2f6; color: #7f8c8d;">
        <span>⚡ Hệ thống sẵn sàng nhận mã quét</span>
    </div>
</div>

<script>
    const inputField = document.getElementById('MaNhanVien');
    const resultDiv = document.getElementById('result');

    // Luôn giữ focus vào ô input ngay cả khi bấm linh tinh trên màn hình
    document.addEventListener('click', () => {
        inputField.focus();
    });

    // Lắng nghe sự kiện nhấn phím từ máy quét QR (hoặc bàn phím)
    inputField.addEventListener('keydown', async function(e) {
        // Khi máy quét QR truyền xong dữ liệu, nó sẽ tự động gửi kèm phím 'Enter'
        if (e.key === 'Enter') {
            e.preventDefault();
            const maNhanVien = inputField.value.trim();
            
            if (!maNhanVien) return;

            // Lấy thời gian thực tế ngay khi quét
            const now = new Date();
            const timeString = now.toLocaleTimeString('vi-VN');
            const dateString = now.toLocaleDateString('vi-VN');
            const fullTime = `${timeString} ngày ${dateString}`;

            // Hiển thị trạng thái đang xử lý
            resultDiv.style.backgroundColor = '#fff3cd';
            resultDiv.style.color = '#856404';
            resultDiv.innerHTML = `<span>⏳ Đang kiểm tra mã ${maNhanVien}...</span>`;

            try {
                const webhookUrl = 'https://driver-encrypt-remake.ngrok-free.dev/webhook/nhan-suat-an';  

                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ MaNhanVien: maNhanVien })
                });

                const responseText = await response.text();
                
                if (responseText.includes("Bạn đã đăng kí thành công")) {
                    resultDiv.style.backgroundColor = '#e8f8f5';
                    resultDiv.style.color = '#27ae60'; 
                    resultDiv.innerHTML = `
                        <div>✅ Mã ${maNhanVien}: Đăng kí thành công!</div>
                        <div class="time-text">🕒 Thời gian: ${fullTime}</div>
                    `;
                } else {
                    resultDiv.style.backgroundColor = '#fdedec';
                    resultDiv.style.color = '#c0392b'; 
                    resultDiv.innerHTML = `
                        <div>❌ Mã ${maNhanVien}: Chưa đăng kí suất cơm!</div>
                        <div class="time-text">🕒 Thời gian: ${fullTime}</div>
                    `;
                }

            } catch (error) {
                resultDiv.style.backgroundColor = '#fdedec';
                resultDiv.style.color = '#c0392b';
                resultDiv.innerHTML = `<div>❌ Lỗi kết nối hệ thống!</div>`;
            }

            // Xóa trắng ô input và chuẩn bị cho lượt quét tiếp theo ngay lập tức
            inputField.value = '';
            inputField.focus();
        }
    });
</script>

</body>
</html>
