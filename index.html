<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Suất Ăn Nhà Máy - Sinaran VN</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .header-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .avatar-icon {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }
        .brand-name {
            font-family: serif;
            font-size: 32px;
            font-style: italic;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }
        h2 {
            color: #34495e;
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: 600;
        }
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 18px;
            font-size: 22px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            background-color: #fafbfc;
            letter-spacing: 1px;
        }
        input[type="text"]:focus {
            border-color: #27ae60;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(39, 174, 96, 0.25);
        }
        .instruction {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        #result {
            margin-top: 20px;
            padding: 18px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }
        .time-text {
            font-size: 13px;
            color: #555;
            font-weight: normal;
        }
        .emp-name {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header-section">
        <div class="avatar-icon">👨‍💼</div>
        <div class="brand-name">Sinaran VN</div>
    </div>

    <h2>🍽️ Xác Nhận Suất Ăn Nhà Máy</h2>
    
    <div class="instruction" id="status-load">⏳ Đang tải danh sách đăng ký vào hệ thống...</div>

    <div class="input-group">
        <input type="text" id="MaNhanVien" placeholder="Chờ quét mã..." autocomplete="off" disabled>
    </div>
    
    <div id="result" style="background-color: #f1f2f6; color: #7f8c8d;">
        <span>⚡ Vui lòng đợi tải dữ liệu xong...</span>
    </div>
</div>

<script>
    const inputField = document.getElementById('MaNhanVien');
    const resultDiv = document.getElementById('result');
    const statusLoad = document.getElementById('status-load');
    
    let localRegisteredList = [];

    // URL Webhook n8n của bạn (Thay đổi đường dẫn webhook lấy danh sách và ghi log cho đúng thực tế)
    const WEBHOOK_GET_LIST = 'https://driver-encrypt-remake.ngrok-free.dev/webhook/lay-danh-sach'; 
    const WEBHOOK_LOG_SCAN = 'https://driver-encrypt-remake.ngrok-free.dev/webhook/nhan-suat-an';     

    // 1. Tải toàn bộ danh sách đăng ký về trình duyệt ngay khi mở trang
    async function loadDataToBrowser() {
        try {
            const response = await fetch(WEBHOOK_GET_LIST);
            const data = await response.json();
            localRegisteredList = Array.isArray(data) ? data : (data.list || []);
            
            // Mở khóa ô nhập để quét mã
            inputField.disabled = false;
            inputField.placeholder = "Đang chờ quét mã...";
            inputField.focus();
            statusLoad.innerHTML = `✅ Đã tải xong (${localRegisteredList.length} nhân viên đăng ký)`;
            statusLoad.style.color = '#27ae60';
            resultDiv.innerHTML = `<span>⚡ Hệ thống sẵn sàng nhận mã quét</span>`;
        } catch (error) {
            statusLoad.innerHTML = `❌ Lỗi tải danh sách! Hãy kiểm tra lại kết nối.`;
            statusLoad.style.color = '#c0392b';
        }
    }

    loadDataToBrowser();

    // Giữ focus liên tục vào ô input
    document.addEventListener('click', () => {
        if(!inputField.disabled) inputField.focus();
    });

    // 2. So sánh và hiển thị kết quả ngay lập tức khi quét mã
    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const scannedId = inputField.value.trim().toUpperCase();
            if (!scannedId) return;

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const scannedDate = `${year}-${month}-${day}`;
            const scanTime = now.toLocaleTimeString('vi-VN');
            const formattedDate = `${day}/${month}/${year}`;

            // Tìm kiếm trực tiếp trong bộ nhớ RAM của trình duyệt (Tốc độ cực nhanh ~0.001s)
            const found = localRegisteredList.find(item => {
                const row = item.json || item;
                const sheetId = String(row['Mã NV'] || '').trim().toUpperCase();
                const sheetDate = String(row['Ngày Nhận'] || '').trim().substring(0, 10);
                return (sheetId === scannedId) && (sheetDate === scannedDate);
            });

            if (found) {
                const rowData = found.json || found;
                const empName = rowData['Tên NV'] || 'Nhân viên';

                // Hiển thị ngay lập tức lên màn hình
                resultDiv.style.backgroundColor = '#e8f8f5';
                resultDiv.style.color = '#27ae60';
                resultDiv.innerHTML = `
                    <div class="emp-name">👤 ${empName} (${scannedId})</div>
                    <div>✅ Check-in thành công!</div>
                    <div class="time-text">🕒 Thời gian: ${scanTime} ngày ${formattedDate}</div>
                `;
            } else {
                // Báo lỗi ngay lập tức nếu chưa đăng ký
                resultDiv.style.backgroundColor = '#fdedec';
                resultDiv.style.color = '#c0392b';
                resultDiv.innerHTML = `
                    <div>❌ Mã ${scannedId}: Chưa đăng kí suất cơm!</div>
                    <div class="time-text">🕒 Thời gian: ${scanTime} ngày ${formattedDate}</div>
                `;
            }

            // 3. Gửi ngầm dữ liệu lên n8n để ghi vào Google Sheets ở phía sau (Không làm gián đoạn người dùng)
            fetch(WEBHOOK_LOG_SCAN, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ MaNhanVien: scannedId })
            }).catch(err => console.log('Lỗi ghi log ngầm:', err));

            // Xóa trắng ô input để sẵn sàng cho lượt quét kế tiếp
            inputField.value = '';
            inputField.focus();
        }
    });
</script>

</body>
</html>
