<script>
    const form = document.getElementById('mealForm');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const maNhanVien = document.getElementById('MaNhanVien').value.trim();
        resultDiv.style.color = '#555';
        resultDiv.textContent = `Đang xử lý cho nhân viên [${maNhanVien}]...`;

        try {
            // Đường dẫn Webhook n8n của bạn qua Ngrok
            const webhookUrl = 'https://driver-encrypt-remake.ngrok-free.dev/webhook/nhan-suat-an';  

            const response = await fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ MaNhanVien: maNhanVien })
            });

            const responseText = await response.text();
            
            // Hiển thị kết quả trả về từ n8n (kèm theo mã nhân viên để dễ phân biệt)
            if (responseText.includes("thành công")) {
                resultDiv.style.color = '#28a745'; // Màu xanh lá khi thành công
                resultDiv.innerHTML = `✅ NV <b>${maNhanVien}</b>: ${responseText}`;
            } else if (responseText.includes("trước đó")) {
                resultDiv.style.color = '#ffc107'; // Màu vàng khi quét trùng
                resultDiv.innerHTML = `⚠️ NV <b>${maNhanVien}</b>: ${responseText}`;
            } else {
                resultDiv.style.color = '#dc3545'; // Màu đỏ khi chưa đăng ký hoặc lỗi
                resultDiv.innerHTML = `❌ NV <b>${maNhanVien}</b>: ${responseText}`;
            }

        } catch (error) {
            resultDiv.style.color = '#dc3545';
            resultDiv.textContent = '❌ Không thể kết nối đến hệ thống n8n!';
        }

        // Xóa ô nhập mã sau khi gửi xong để quét tiếp nhân viên tiếp theo
        document.getElementById('MaNhanVien').value = '';
        document.getElementById('MaNhanVien').focus();
    });
</script>
