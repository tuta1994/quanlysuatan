<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Suất Ăn Nhà Máy - Sinaran</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: white;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .header-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .avatar-icon {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(52, 152, 219, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(52, 152, 219, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(52, 152, 219, 0); }
        }
        .brand-name {
            font-family: serif;
            font-size: 32px;
            font-style: italic;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }
        h2 {
            color: #34495e;
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: 600;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            background-color: #fafbfc;
        }
        input[type="text"]:focus {
            border-color: #27ae60;
            background-color: #fff;
            box-shadow: 0 0 8px rgba(39, 174, 96, 0.2);
        }
        button {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
            transition: all 0.3s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #219653 0%, #27ae60 100%);
            transform: translateY(-2px);
        }
        #result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .time-text {
            font-size: 14px;
            color: #7f8c8d;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Phần Logo Sinaran kết hợp Icon Nhân viên sinh động -->
    <div class="header-section">
        <div class="avatar-icon" title="Nhân viên quét mã">👨‍💼</div>
        <div class="brand-name">Sinaran</div>
    </div>

    <h2>🍽️ Xác Nhận Suất Ăn Nhà Máy</h2>
    
    <form id="mealForm">
        <div class="input-group">
            <input type="text" id="MaNhanVien" name="MaNhanVien" placeholder="Nhập mã nhân viên" required autocomplete="off" autofocus>
        </div>
        <button type="submit">Xác Nhận</button>
    </form>
    
    <div id="result"></div>
</div>

<script>
    const form = document.getElementById('mealForm');
    const resultDiv = document.getElementById('result');
    const inputField = document.getElementById('MaNhanVien');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const maNhanVien = inputField.value.trim();
        
        if (!maNhanVien) return;

        // Lấy thời gian thực tế ngay khi quét mã
        const now = new Date();
        const timeString = now.toLocaleTimeString('vi-VN');
        const dateString = now.toLocaleDateString('vi-VN');
        const fullTime = `${timeString} ngày ${dateString}`;

        resultDiv.style.backgroundColor = '#f1f2f6';
        resultDiv.style.color = '#555';
        resultDiv.innerHTML = `<span>⏳ Đang kiểm tra...</span>`;

        try {
            const webhookUrl = 'https://driver-encrypt-remake.ngrok-free.dev/webhook/nhan-suat-an';  

            const response = await fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ MaNhanVien: maNhanVien })
            });

            const responseText = await response.text();
            
            if (responseText.includes("Bạn đã đăng kí thành công")) {
                resultDiv.style.backgroundColor = '#e8f8f5';
                resultDiv.style.color = '#27ae60'; 
                resultDiv.innerHTML = `
                    <div>✅ Mã ${maNhanVien}: Bạn đã đăng kí thành công</div>
                    <div class="time-text">🕒 Thời gian: ${fullTime}</div>
                `;
            } else {
                resultDiv.style.backgroundColor = '#fdedec';
                resultDiv.style.color = '#c0392b'; 
                resultDiv.innerHTML = `
                    <div>❌ Mã ${maNhanVien}: Bạn chưa đăng kí suất cơm</div>
                    <div class="time-text">🕒 Thời gian: ${fullTime}</div>
                `;
            }

        } catch (error) {
            resultDiv.style.backgroundColor = '#fdedec';
            resultDiv.style.color = '#c0392b';
            resultDiv.textContent = '❌ Lỗi kết nối hệ thống!';
        }

        inputField.value = '';
        inputField.focus();
    });
</script>

</body>
</html>
